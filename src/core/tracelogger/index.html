<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="utf-8" />
<style>

:root {
   --body: #d4d4d4;
   --bodybg: #252526;
   --panelbg: #333333;
   --inputbg: #3f3f3f;
   --inputbghover: #4b4b4b;
   --scrollbar: #252526;
   --scrollbarthumb: #4b4b4b;
   --border: #6a6d70;
   --focus: #d9dbdc;
   --green: #69C575;
   --greenhover: #82c98c;
   --darkgreen: #49a354;
   --greencontrast: #102315;
   --red: #d83b31;
   --redhover: #c43228;
   --redbright: #ff6b63;
   --yellow: #ffd12b;
   --white: #FFFFFF;
}


::-webkit-scrollbar {
    width: 12px;
    height: 12px;
    background-color: var(--scrollbar);
    cursor:pointer;
}

::-webkit-scrollbar-thumb {
    background-color: var(--scrollbarthumb);
    border-radius: 6px;
    border: 4px solid var(--scrollbar);
}

::-webkit-scrollbar-corner {
    background-color: var(--scrollbar);
}

* {
    scrollbar-color: var(--scrollbarthumb) var(--scrollbar);
    scrollbar-width: thin;
}

body {
    margin: 0;
    padding: 0;
    position: relative;
    font-family: Verdana, Arial, Helvetica, sans-serif;
    min-height: 100vh;
    background-color: var(--bodybg);
    color: var(--body);
    font-size: .7em;

}

a {color:var(--yellow);text-decoration:underline;text-underline-position:under;}
a:hover {color: var(--white);}

:focus {outline:none;}

#ctrl {
    padding: 5px;
    background: var(--panelbg);
    color: var(--white);
    position: sticky;
    top: 0;
    right: 0;
    left: 0;
    border-bottom: 1px solid var(--border);
    min-width: 615px;
    overflow: hidden;
    display: grid;
    grid-auto-flow: column;
    gap: 5px;
    grid-template-rows: 1fr 1fr;
    grid-template-columns: 1fr 1fr minmax(auto, 2fr);
}

#ctrl button {
    width: 150px;
}

#ctrl .connect-button {
    display: flex;
    justify-content: flex-start;
    align-items: center;
    gap: 15px;
}

#tracecont {
    margin: 20px 10px;
}

#console {
    margin: 0 5px 0 5px;
    font: 10pt "courier new", monospace;
}

span.err {
    font-weight: bold;
    color: var(--redbright);
}

.led-red,
.led-green {
    width: 25px;
    height: 25px;
    border-radius: 50%;
}


.led-red {
    background-color: var(--redbright);
    box-shadow: #000 0 -1px 7px 1px, inset rgba(255, 210, 205, 0.8) 0 -1px 8px, rgba(196, 50, 40, 0.75) 0 2px 10px;
}

.led-green {
    background-color: var(--green);
    box-shadow: #00000077 0 -1px 7px 1px, inset rgba(209, 255, 184, 0.65) 0 -1px 8px, rgba(73, 163, 84, 0.8) 0 2px 8px;
}

.vertical-center {
    display: flex;
    align-items: center;
}

button {
    padding: 5px 12px;
    line-height: 1em;
    border-radius: 4px;
    background-color: var(--green);
    color: var(--greencontrast);
    font-weight: bold;
    border: 1px solid var(--green);
    cursor: pointer;
    transition: all .3s ease;
}
button:hover {
    background-color: var(--greenhover);
    border-color: var(--greenhover);
}

button.red {
    background-color: var(--red);
    color: var(--white);
    border-color: var(--red);
}
button.red:hover {
    background-color: var(--redhover);
    border-color: var(--redhover);
}

label {
    display: grid;
    grid-template-columns: initial;
    grid-template-rows: initial;
    grid-auto-flow: column;
    align-items: center;
    justify-content: flex-start;
    cursor: pointer;
}

input[type="text"]{
    display: inline-block;
    padding: 5px 12px;
    background-color: var(--inputbg);
    border-radius: 4px;
    border: solid 1px var(--border);
    outline: none;
    color: var(--white);
    transition: all .3s ease;
}

button:disabled {
    background: #3f4e4f;
    border-color: #3f4e4f;
    color: #b7c3c4;
    cursor: default;
}

input[type="text"]:focus,
input[type="text"]:active {
    border-color: var(--focus);
    background-color: var(--inputbghover);
}
input[type="text"]::placeholder {
    color: #bdbdbd;
}

input[type="checkbox"] {
    display: inline-block;
    background: transparent;
    color: transparent;
    position: relative;
    z-index: 1;
    width: 18px;
    height: 18px;
    margin-right: 12px;
    accent-color: var(--green);
    border: solid 2px var(--border);
    border-radius: 5px;
}

input[type="checkbox"]:checked::after {
    border-color: var(--green);
    background-color: var(--green);
    background-size: 15px;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 457.57"><path fill="white" d="M0,220.57c100.43-1.33,121-5.2,191.79,81.5,54.29-90,114.62-167.9,179.92-235.86C436-.72,436.5-.89,512,.24,383.54,143,278.71,295.74,194.87,457.57,150,361.45,87.33,280.53,0,220.57Z"/></svg>');
    background-position: center;
    background-repeat: no-repeat;
}

input[type=checkbox]::after {
    content: "";
    position: absolute;
    z-index: 3;
    display: flex;
    justify-content: flex-start;
    align-items: flex-start;
    border: 3px solid transparent;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    border-radius: 5px;
    cursor: pointer;
    transition: all .4s ease;
}

select {
    padding: 5px 12px;
    background-color: var(--inputbg);
    color: var(--white);
    cursor: pointer;
    outline: none;
    border-radius: 4px;
    border: solid 1px var(--border);
}
select:focus {
    border-color: var(--focus);
    background-color: var(--inputbghover);
}
select option {
    color: var(--white);
    background-color: var(--panelbg);
}
.advanced {display:none;}
</style>
<title>TraceLogger</title>
<script>
const trUrl = "/rtl/tracelogger.service/"
const docUrl = "https://realtimelogic.com/ba/doc/?url=auxlua.html#tracelogger";
const q = id => document.getElementById(id);
const on = (e,n,f) => e.addEventListener(n,f);

//Must match C code
const TR_set = 1
const TR_data = 2
const TR_acquired = 3

const TS_Http11State = 1
const TS_Request = 2
const TS_RequestHeaders = 3
const TS_setResponseHeaders = 4
const TS_setResponseBody = 5
const TS_TraceButtonState = 6
const TS_TraceLevel = 7

function escapeHtml(unsafe) {
    return unsafe
	.replace(/&/g, "&amp;")
	.replace(/</g, "&lt;")
	.replace(/>/g, "&gt;")
	.replace(/"/g, "&quot;")
	.replace(/'/g, "&#039;");
};

let writeCon;
let writeConErr;
function log(msg) {writeCon(msg);}
function logErr(msg) {writeConErr(msg);}

let websock = null;
let started=false;
let busy=false;
let connect;
function startTL() {
    started=true;
    q("ctrl").style.display="";
    if( !websock && !busy ) {
	busy=true;
	writeCon("Starting <a target='_blank' href='"+docUrl+"'>TraceLogger</a>....\n");
	connect(false);
    }
}

addEventListener("DOMContentLoaded", function () {

    let serverSetTraceState;
    let conElem = q("console");
    let ctrl = q("ctrl");
    let conHasData = false;
    let reconnect=true;

    let hv=false; //ctrl header visible
    ctrl.style.display="none";
    let hvtimer=false
    function showH() {
	if(hvtimer) {
	    clearTimeout(hvtimer);
	    hvtimer=false;
	}
	else if(!hv && started) {
	    ctrl.style.display="";
	    hv=true;
	}
    };
    function delayedHideH() {
	if(websock && !hvtimer) {
	    hvtimer=setTimeout(()=>{
		ctrl.style.display="none";
		hvtimer=false;
		hv=false;
	    }, 3000);
	}
    };
    on(document.body,"mouseenter",showH);
    on(document.body,"mouseleave",delayedHideH);

    function clearCon() {
	conHasData = false;
	conElem.textContent="";
	q("EraseTrace").disabled=true;
    };

    writeCon=function(txt) {
	if (!conHasData) {
	    conHasData = true;
	    q("EraseTrace").disabled=false;
	}
	conElem.insertAdjacentHTML("beforeend",txt);
	if (document.body.scrollHeight)
	    window.scrollTo(0, document.body.scrollHeight);
    };

    writeConErr=function(txt) {
	writeCon("<span class='err'>" + txt + "</span>");
    }

    function isChecked(self) {
	return self.checked;
    };

    function setChecked(elem, checked) {
	q(elem).checked=checked;
    };

    function setConnectedState(connected) {
	if(connected) delayedHideH();
	else showH();
	q("ToggleConnect").classList.toggle("red",!connected);
	q("led").className=connected ? "led-green" : "led-red";
	setConnectBut("Connect", false);
    };


    function setConnectBut(txt, disabled) {
	let b=q("ToggleConnect");
	b.textContent=txt;
	b.disabled=disabled;
    };

    function setDisconState() {
	websock = null;
	setConnectedState(false);
	setConnectBut("Connect", false);
    };

    function startWS(reconnected) {
	let proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
	let ws = new WebSocket(proto+location.host+trUrl);
	ws.binaryType = "arraybuffer";
	ws.onopen = function(ev)
	{
	    websock=ws;
	    setConnectedState(true);
	    setConnectBut("Close", false);
	    writeCon("Connected!\n");
	    if(reconnected && window.top && window.top.onreconnect)
		window.top.onreconnect();
	};
	ws.onmessage = function (ev)
	{
	    let d = new Uint8Array(ev.data);
	    switch(d[0]) {
	    case TR_set:
		setChecked("SetRequest",	d[1]?true:false);
		setChecked("SetRequestHeaders", d[2]?true:false);
		setChecked("SetResponseHeaders",d[3]?true:false);
		setChecked("SetHttp11State",	d[4]?true:false);
		setChecked("SetResponseBody",	d[5]?true:false);
		q("TraceLevel").value=d[6];
		break;
	    case TR_data:
		writeCon(escapeHtml(new TextDecoder().decode(d.subarray(1))));
		break;
	    case TR_acquired:
		writeConErr("Connection closed by another client.\n");
		reconnect=false;
		break
	    }
	};
	ws.onclose = function(ev)
	{ 
	    if(websock) {
		setDisconState();
		if(reconnect) writeConErr("WebSocket connection closed with code: "+ev.code+".\n");
	    }
	    else if(reconnect) writeCon("Disconnected!\n");
	    if(reconnect) setTimeout(connect, 3000);
	};
    };

    connect=function(force) {
	reconnect=true;
	setConnectBut("Connecting...", true);
	function ajaxRsp(status,tl) {
	    if( tl && (status == 204 || status == 503) )
	    {
		busy=false;
		if(status == 204 || force) {
		    startWS(true);
		}
		else {
		    reconnect=false;
		    setConnectBut("Connect", false);
		    writeConErr("The TraceLogger is serving another client.\n"+
				"Click the Connect button to force the other client to disconnect!\n");
		}
	    }
	    else if(status == 401) {
		setConnectBut("(disabled)",true);
		if(window.top && window.top.authenticate)
		    window.top.authenticate();
		else
		    writeConErr("You are not authenticated!\n");
	    }
	    else if(status == 0) {
		writeConErr("Cannot connect\n");
		setTimeout(connect, 3000);
	    }
	    else
	    {
		setConnectBut("Cannot Connect",true);
		writeConErr("Service at "+trUrl+" is not a TraceLogger or the TraceLogger service is not running!\nSee the <a href='"+docUrl+"'>documentation</a> for details.\n");
	    }
	};
	fetch(trUrl,{headers:{"X-Requested-With":"XMLHttpRequest"}}).then(r=>ajaxRsp(r.status,r.headers.get("tracelogger"))).catch(()=>ajaxRsp(0));
    };
    clearCon();

    function sendCmd(cmd, val) {
	if(websock) {
	    let d = new Uint8Array(2);
	    d[0]=cmd;
	    d[1]=val;
	    websock.send(d);
	};
    };

    on(q("SetRequest"),"click",function(){sendCmd(TS_Request,isChecked(this));});
    on(q("SetRequestHeaders"),"click",function(){
	sendCmd(TS_RequestHeaders,isChecked(this));
	if(isChecked(this)) setChecked("SetRequest", true);
    });
    on(q("SetResponseHeaders"),"click",function(){sendCmd(TS_setResponseHeaders,isChecked(this));});
    on(q("SetResponseBody"),"click",function(){
	if(q("SetResponseHeaders").checked) {
	    sendCmd(TS_setResponseHeaders,false);
	    setChecked("SetResponseHeaders", false);
	}
	sendCmd(TS_setResponseBody,isChecked(this));
    });
    on(q("SetHttp11State"),"click",function(){sendCmd(TS_Http11State,isChecked(this));});
    on(q("TraceLevel"),"change",function() {sendCmd(TS_TraceLevel,this.value);});
    on(q("EraseTrace"),"click",clearCon);
    on(q("ToggleConnect"),"click",function() {
	if(websock) { websock.close(); websock=null; reconnect=false; setDisconState(); }
	else connect(true);
    });
    if(location.search.includes('?advanced='))
	ctrl.querySelectorAll('.advanced').forEach(e=>e.classList.remove('advanced'));
    if( ! location.search.includes('?embedded=') ) startTL();
});
</script>
</head>
<body>
  <div id="ctrl">
    <label><input id="SetRequest" type="checkbox" /> Request</label>
    <label><input id="SetRequestHeaders" type="checkbox" /> Request Headers</label>
    <label><input id="SetResponseHeaders" type="checkbox" /> Response Headers</label>
    <div class="vertical-center">
      Trace Level&nbsp;&nbsp;
      <select id="TraceLevel" name="TraceLevel">
	<option value="0">&nbsp;0</option>
	<option value="1">&nbsp;1</option>
	<option value="2">&nbsp;2</option>
	<option value="3">&nbsp;3</option>
	<option value="4">&nbsp;4</option>
	<option value="5">&nbsp;5</option>
	<option value="6">&nbsp;6</option>
	<option value="7">&nbsp;7</option>
	<option value="8">&nbsp;8</option>
	<option value="9">&nbsp;9</option>
	<option value="10">&nbsp;10</option>
	<option value="15">&nbsp;15</option>
	<option value="20">&nbsp;20</option>
      </select>
    </div>
    <label class="advanced"><input id="SetResponseBody" type="checkbox" /> Response Body</label>
    <label class="advanced"><input id="SetHttp11State" type="checkbox" /> HTTP 1.1 State</label>
    <div>
      <button id="EraseTrace">Erase Trace</button>
    </div>
    <div class="connect-button">
      <button id="ToggleConnect">Connect</button>
      <div id="led" class="led-red"></div>
    </div>
  </div>
  <div id="tracecont">
    <pre id="console"><span class='err'>JavaScript not enabled!</span></pre>
  </div>
</body>
</html>
